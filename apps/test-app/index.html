<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentConnect Test App</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap');

      :root {
        color-scheme: light;
        font-family: 'Manrope', sans-serif;
        background: #f5f2ed;
        color: #1a1917;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 10% 10%, rgba(239, 212, 184, 0.35), transparent 50%),
          radial-gradient(circle at 90% 20%, rgba(210, 225, 240, 0.4), transparent 50%), #f5f2ed;
      }

      .demo-shell {
        width: min(980px, 92vw);
        display: grid;
        gap: 24px;
      }

      .demo-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .demo-status {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #e5dfd7;
        background: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        font-weight: 600;
        color: #3a3530;
      }

      .chat-card {
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #ebe5dd;
        padding: 18px;
        box-shadow: 0 20px 40px rgba(26, 25, 23, 0.08);
        display: grid;
        gap: 16px;
      }

      .chat-summary {
        display: grid;
        gap: 6px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #e3ddd3;
        background: #faf7f2;
        color: #1a1917;
      }

      .chat-summary-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6f655b;
      }

      .chat-summary-text {
        font-size: 14px;
        font-weight: 600;
        color: #221f1b;
      }

      .mcp-card {
        border: 1px solid #e5dfd7;
        border-radius: 16px;
        padding: 14px;
        background: #fcfaf7;
        display: grid;
        gap: 12px;
      }

      .mcp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .mcp-note {
        font-size: 12px;
        color: #5b5248;
      }

      .mcp-warning {
        font-size: 12px;
        color: #7f2d22;
        background: #fff3f1;
        border: 1px solid #f1c7bf;
        border-radius: 10px;
        padding: 8px 10px;
      }

      .mcp-header-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mcp-header-actions button {
        border: none;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      .mcp-header-actions button.secondary {
        background: #ffffff;
        color: #1a1917;
        border: 1px solid #e5dfd7;
      }

      .mcp-header-actions button.tertiary {
        background: #faf7f3;
        color: #1a1917;
        border: 1px solid #e0d8ce;
      }

      .mcp-list {
        display: grid;
        gap: 10px;
      }

      .mcp-row {
        border: 1px solid #e6dfd5;
        border-radius: 12px;
        padding: 10px;
        background: #ffffff;
        display: grid;
        gap: 8px;
      }

      .mcp-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .mcp-field {
        display: grid;
        gap: 4px;
      }

      .mcp-field.mcp-field-wide {
        grid-column: 1 / -1;
      }

      .mcp-field label {
        font-size: 11px;
        font-weight: 600;
        color: #4c443b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .mcp-field input {
        width: 100%;
        border: 1px solid #dcd4ca;
        border-radius: 10px;
        background: #ffffff;
        color: #171412;
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
      }

      .mcp-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mcp-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #4f473f;
      }

      .mcp-toggle input {
        margin: 0;
      }

      .mcp-remove {
        border: 1px solid #e3dbd1;
        border-radius: 999px;
        background: #ffffff;
        color: #2b2621;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        cursor: pointer;
      }

      .chat-log {
        min-height: 260px;
        max-height: 360px;
        overflow-y: auto;
        padding: 8px;
        display: grid;
        gap: 12px;
      }

      .chat-message {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid #efe9e1;
        background: #fdfbf9;
        color: #1a1917;
        font-size: 14px;
        line-height: 1.5;
      }

      .chat-message.user {
        background: #f6f3ee;
        border-color: #e4dccf;
      }

      .chat-message.assistant {
        background: #ffffff;
        border-color: #e5dfd7;
      }

      .chat-message.error {
        background: #fff3f1;
        border-color: #f1c7bf;
        color: #7f2d22;
      }

      .chat-message.system {
        background: #f7f5f2;
        color: #4b453f;
      }

      .chat-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8a7f72;
      }

      .chat-input {
        display: grid;
        gap: 12px;
      }

      .chat-input textarea {
        width: 100%;
        min-height: 90px;
        resize: vertical;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #e5dfd7;
        background: #ffffff;
        font-family: inherit;
        font-size: 14px;
        color: #1a1917;
      }

      .chat-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        justify-content: flex-end;
      }

      .chat-actions button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        background: #1a1917;
        color: #ffffff;
      }

      .chat-actions button.secondary {
        background: #ffffff;
        color: #1a1917;
        border: 1px solid #e5dfd7;
      }

      .chat-actions button.tertiary {
        background: #faf7f3;
        color: #1a1917;
        border: 1px solid #e0d8ce;
      }

      .chat-actions button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      agentconnect-connect {
        --ac-font-family: 'Manrope', sans-serif;
        --ac-accent: #3b82f6;
        --ac-button-bg: #1a1917;
        --ac-button-color: #ffffff;
        --ac-button-secondary-bg: #ffffff;
        --ac-button-secondary-color: #1a1917;
        --ac-button-secondary-border: #e5dfd7;
        --ac-button-ghost-color: #5e564c;
        --ac-button-ghost-border: #e5dfd7;
        --ac-chip-bg: #eef2ff;
        --ac-chip-color: #1a1917;
        --ac-modal-bg: #ffffff;
        --ac-modal-color: #1a1917;
        --ac-modal-border: #e5dfd7;
        --ac-card-border: #ebe5dd;
        --ac-card-active-bg: #f6f3ee;
        --ac-alert-bg: #ffffff;
        --ac-alert-color: #1a1917;
        --ac-alert-border: #e5dfd7;
        --ac-muted: #7c7266;
      }

      @media (max-width: 720px) {
        .demo-shell {
          gap: 18px;
        }

        .chat-card {
          padding: 14px;
        }

        .mcp-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-shell">
      <div class="demo-header">
        <agentconnect-connect></agentconnect-connect>
        <div class="demo-status" data-ac-status>Not connected</div>
      </div>
      <div class="chat-card">
        <div class="mcp-card">
          <div class="mcp-header">
            <div>
              <div class="chat-summary-label">MCP Loadout</div>
              <div class="mcp-note" data-mcp-note>
                MCP servers are applied for Claude, Codex, and Cursor.
              </div>
            </div>
            <div class="mcp-header-actions">
              <button class="tertiary" type="button" data-mcp-add>+ Add Server</button>
              <button class="secondary" type="button" data-mcp-reset>Reset Defaults</button>
            </div>
          </div>
          <div class="mcp-warning" data-mcp-warning hidden></div>
          <div class="mcp-list" data-mcp-list></div>
        </div>
        <div class="chat-summary" data-chat-summary hidden>
          <div class="chat-summary-label">Summary</div>
          <div class="chat-summary-text" data-chat-summary-text></div>
        </div>
        <div class="chat-log" data-chat-log></div>
        <form class="chat-input" data-chat-form>
          <textarea
            data-chat-input
            placeholder="Write a prompt to test the connected agent..."
          ></textarea>
          <div class="chat-actions">
            <button class="secondary" type="button" data-chat-stop>Stop</button>
            <button type="submit" data-chat-send>Send</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
